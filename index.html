<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#245440">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-kJS8GLKbFwaT+LOeBAyDuh595Ai1+xveg4mewdGGJ2A='; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
  <title>《人工智能在蚕桑产业科研中的应用现状、挑战与展望》专家问卷</title>
  <style>
:root{--bg:#f6f7f2;--paper:#fff;--ink:#22392f;--muted:#718078;--line:#e1e7df;--green:#245440;--soft:#eef3eb;--gold:#a4783d;--red:#af4c36;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);-webkit-font-smoothing:antialiased}
button{cursor:pointer}
a{color:var(--green)}
[hidden]{display:none!important}
.topbar{height:94px;max-width:1360px;margin:auto;padding:0 60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;text-decoration:none;font-size:21px;letter-spacing:2px;font-weight:650}
.site-footer{max-width:1240px;margin:45px auto 0;padding:24px 0 32px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:1px}
.welcome{max-width:1240px;margin:0 auto;padding:62px 0 0}
.hero{display:grid;grid-template-columns:1.12fr 1fr;gap:60px;align-items:center;padding:0 26px}
.hero h1{font-family:"Songti SC","STSong",serif;font-size:56px;line-height:1.3;font-weight:500;letter-spacing:1px;margin:24px 0}
.hero h1 em{font-style:normal;color:#628367}
.hero p{max-width:490px;color:#647168;font-size:15px;line-height:1.95}
.hero-buttons{display:flex;align-items:center;gap:25px;margin-top:31px}
.primary,.secondary{border:1px solid var(--green);border-radius:7px;padding:13px 25px;font-size:14px;font-weight:550;display:inline-flex;gap:25px;align-items:center;justify-content:center;text-decoration:none;transition:background .2s,transform .2s}
.primary{background:var(--green);color:#fff}
.primary:hover{background:#173d2d;transform:translateY(-1px)}
.secondary{background:#fff;color:var(--green);border-color:#d1dbcf}
.secondary:hover{background:var(--soft)}
.hero-meta{display:flex;gap:28px;margin-top:24px;font-size:11px;color:var(--muted)}
.hero-meta span:before{content:'✓';margin-right:7px;color:#6a8968}
.welcome-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:56px;border-top:1px solid var(--line);padding-top:26px;gap:28px}
.welcome-info{padding:0 26px}
.welcome-info+.welcome-info{border-left:1px solid var(--line)}
.welcome-info h3{font-size:15px;font-weight:550;margin:5px 0}
.welcome-info p{font-size:12px;color:var(--muted);margin:0}
.survey-layout{max-width:1200px;margin:42px auto 0;display:grid;grid-template-columns:226px minmax(0,1fr);gap:44px;align-items:start}
.rail{position:sticky;top:25px}
.rail-title{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 22px 16px}
.step-link{display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;text-align:left;padding:13px 16px;margin-bottom:5px;border-radius:7px;color:#849086;font-size:13px}
.step-link .step-number{width:24px;font-size:11px;font-variant-numeric:tabular-nums}
.step-link.active{color:var(--green);background:#e6eddf;font-weight:600}
.step-link.done{color:#536b55}
.form-header{margin-bottom:25px}
.section-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);letter-spacing:1px}
.progress{height:3px;background:#e0e6dc;margin-top:12px;border-radius:4px}
.progress span{display:block;height:100%;background:#6e8c63;border-radius:4px;transition:width .3s}
.form-header h1{font-family:"Songti SC","STSong",serif;font-size:33px;line-height:1.3;font-weight:500;margin:27px 0 9px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:32px 36px;margin-bottom:18px}
.question-label{display:block;font-size:14px;font-weight:550;margin-bottom:11px;line-height:1.7}
.qcode{font-size:10px;color:#8a9689;margin-right:9px;font-weight:500;letter-spacing:.5px}
.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:7px 0 0}
.input,select,textarea{width:100%;min-width:0;border:1px solid #dbe2d8;border-radius:6px;padding:11px 13px;background:#fff;color:var(--ink);font-size:13px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid #e1e6de;border-radius:6px;cursor:pointer;font-size:13px;line-height:1.65}
.choice:has(input:checked){border-color:#75956b;background:#f1f5ed}
.choice input{accent-color:var(--green);margin:4px 0 0;flex:none;width:15px;height:15px}
.notice{padding:15px 18px;border-radius:7px;background:var(--soft);color:#5b7155;font-size:12px;line-height:1.8;margin-bottom:23px;display:flex;gap:10px}
.notice.error{background:#fcf0eb;color:var(--red)}
.form-actions{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.scale-table{width:100%;border-collapse:collapse;font-size:12px}
.scale-table th{font-size:11px;color:var(--muted);font-weight:400;padding:9px;white-space:nowrap}
.scale-table td{border-top:1px solid var(--line);padding:13px 5px;text-align:center}
.scale-table td:first-child{text-align:left;width:45%;padding-right:15px}
.scale-table input{accent-color:var(--green);width:16px;height:16px}
.completion{max-width:760px;margin:65px auto;padding:50px;background:white;border:1px solid var(--line);border-radius:13px;text-align:center}
.completion h1{font-family:"Songti SC",serif;font-size:32px;font-weight:500;margin:15px 0}
.completion p{font-size:14px;color:var(--muted)}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 var(--font); }
button, input { font: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid #75956b; outline-offset: 3px; }
.topbar { height: 76px; padding-inline: clamp(20px, 5vw, 60px); }
.site-footer { padding-inline: 8px; margin-inline: auto; width: calc(100% - 40px); }
.brand-mark { position: relative; width: 26px; height: 26px; flex: none; border: 1px solid #a8b79c; border-radius: 50%; background: #edf2e8; }
.brand-mark::before { content: ""; position: absolute; inset: 6px 5px 6px 6px; background: #577952; border-radius: 3px 90% 3px 90%; transform: rotate(-18deg); }
.brand-mark::after { content: ""; position: absolute; width: 12px; height: 1px; top: 13px; left: 6px; background: #e3ecd9; transform: rotate(22deg); }
.welcome { width: calc(100% - 64px); }
.hero h1 { font-size: clamp(31px, 4.25vw, 55px); line-height: 1.28; margin: 16px 0 20px; }
.hero h1 em { display: block; }
.hero .cover-kicker { margin: 0; color: var(--green); font-size: 13px; font-weight: 650; letter-spacing: .16em; }
.cover-art { border-radius: 48% 48% 8px 8px; overflow: hidden; background: #e8eee3; }
.cover-art img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
.welcome-grid { margin-top: 43px; }
.welcome-note { margin: 28px 26px 0; color: var(--muted); font-size: 12px; }
.hero .draft-note { margin: 14px 0 0; color: var(--green); font-size: 13px; }
.action-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
.action-right .hint { margin: 0; text-align: right; }
.form-actions button { flex-shrink: 0; }
.survey-layout { width: calc(100% - 48px); }
.form-main { min-width: 0; }
.section-meta { letter-spacing: 0; }
fieldset.form-card { min-inline-size: 0; margin-inline: 0; }
.form-card h2 { margin: 0 0 14px; }
.qcode { font-size: 12px; color: #536b55; }
legend.visually-hidden, .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.question-hint { margin: 0 0 15px; }
.other-field { display: grid; gap: 6px; margin-top: 14px; font-size: 13px; }
.choice:hover { border-color: #75956b; }
.table-scroll { overflow-x: auto; }
.scale-table { table-layout: auto; }
.scale-table tbody th { text-align: left; color: var(--ink); white-space: normal; border-top: 1px solid var(--line); font-size: 13px; }
.scale-table input { margin: 0; }
.scale-table label { display: grid; justify-items: center; align-content: center; min-height: 34px; cursor: pointer; }
.scale-table label span { display: none; }
.scale-table td:first-child { width: auto; }
.question-error { margin: 10px 0 0; color: var(--red); font-size: 13px; }
.invalid { border-color: var(--red); }
.form-actions { gap: 12px; }
.notice { display: block; }
.completion { margin-inline: auto; }
@media (max-width: 850px) {
  .welcome { width: calc(100% - 48px); padding-top: 36px; }
  .hero { gap: 24px; padding: 0; }
  .hero-meta { flex-wrap: wrap; gap: 8px 16px; }
  .welcome-info { padding: 0 18px; }
  .welcome-note { margin-inline: 0; }
  .survey-layout { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 22px; }
  .rail { position: static; }
  .rail-title { display: none; }
  .rail nav { display: flex; gap: 5px; overflow-x: auto; }
  .step-link { width: auto; white-space: nowrap; }
}
@media (max-width: 680px) {
  .welcome { width: calc(100% - 38px); padding-top: 30px; }
  .hero { grid-template-columns: 1fr; gap: 26px; }
  .cover-art { width: min(100%, 380px); justify-self: center; }
  .welcome-grid { grid-template-columns: 1fr; gap: 0; margin-top: 27px; padding-top: 0; }
  .welcome-info { padding: 13px 0; }
  .welcome-info+.welcome-info { border-left: 0; border-top: 1px solid var(--line); }
  .completion { margin: 24px 15px; }
  .survey-layout { width: calc(100% - 30px); }
  .form-card { padding: 19px 16px; }
  .choice-grid { grid-template-columns: 1fr; }
  .choice { min-height: 44px; }
  .scale-table thead { position: absolute; clip-path: inset(50%); width: 1px; height: 1px; overflow: hidden; }
  .scale-table, .scale-table tbody { display: block; }
  .scale-table tr { display: flex; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 11px 0; }
  .scale-table tbody th { flex-basis: 100%; border: 0; padding: 0 0 7px; }
  .scale-table td { flex: 1 1 16%; border: 0; padding: 3px; }
  .scale-table label { align-content: start; gap: 5px; min-height: 44px; }
  .scale-table label span { display: block; font-size: 11px; }
  .other-field input { font-size: 16px; }
  .form-actions .primary, .form-actions .secondary { min-height: 44px; padding: 10px 14px; }
  .action-right .hint { font-size: 10px; }
}

  </style>
</head>

'use strict';

const app = document.querySelector('#app');
const storageKey = 'sericulture-ai-expert-survey-v1';
const storageTypes = ['localStorage', 'sessionStorage'];
let state = { page: -1, answers: {} };
let showCover = true;
let exited = false;
let savedIn = '';

for (const type of storageTypes) {
  try {
    const draft = JSON.parse(globalThis[type].getItem(storageKey));
    if (draft && Number.isInteger(draft.page) && draft.page >= 0 && draft.page <= sections.length &&
        draft.answers && typeof draft.answers === 'object' && !Array.isArray(draft.answers) &&
        (state.page < 0 || (draft.updatedAt ?? 0) > (state.updatedAt ?? 0))) {
      state = draft;
      savedIn = type;
    }
  } catch {
    // Try the next storage type when access or parsing fails.
  }
}
const previousQ1 = state.answers[1];
if (Number.isInteger(previousQ1?.selected)) previousQ1.selected = [previousQ1.selected];

const escape = value => String(value ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

function save() {
  state.updatedAt = Date.now();
  const draft = JSON.stringify(state);
  savedIn = '';
  for (const type of storageTypes) {
    try {
      globalThis[type].setItem(storageKey, draft);
      savedIn = type;
      break;
    } catch {
      // Fall back to the current tab or keep answers in memory.
    }
  }
  const status = app.querySelector('[data-save-status]');
  if (status) status.textContent = saveMessage();
}

function saveMessage() {
  if (savedIn === 'localStorage') return '进度已保存在此浏览器';
  if (savedIn === 'sessionStorage') return '当前只能在此标签页保留进度';
  return '当前无法保存进度，请保持页面打开';
}

function visible(question) {
  const rule = question.hideWhen;
  return !rule || state.answers[rule.id]?.selected !== rule.option;
}

function button(label, action, primary = false) {
  return `<button type="button" class="${primary ? 'primary' : 'secondary'}" data-action="${action}">${label}</button>`;
}

function matrix(question, answer) {
  const { id, rows, options, rowTitle } = question;
  return `<div class="table-scroll"><table class="scale-table">
    <thead><tr><th scope="col">${escape(rowTitle)}</th>${options.map(option => `<th scope="col">${escape(option)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((row, index) => `<tr><th scope="row">${escape(row)}</th>
      ${options.map((option, value) => `<td><label>
        <input type="radio" name="q${id}-r${index}" value="${value}" data-q="${id}" data-row="${index}" ${answer.rows?.[index] === value ? 'checked' : ''}
          aria-label="${escape(row)}：${escape(option)}">
        <span aria-hidden="true">${escape(option)}</span>
      </label></td>`).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

function hasOther(question, selected) {
  return question.options.some((option, index) =>
    option.startsWith('其他（请注明）') && (Array.isArray(selected) ? selected.includes(index) : selected === index)
  );
}

function choices(question, answer) {
  const { id, options, multiple, maxChoices } = question;
  const multi = multiple || Boolean(maxChoices);
  return `<div class="choice-grid">${options.map((option, index) => {
    const checked = multi ? answer.selected?.includes(index) : answer.selected === index;
    return `<label class="choice">
      <input type="${multi ? 'checkbox' : 'radio'}" name="q${id}" value="${index}" data-q="${id}" ${checked ? 'checked' : ''}>
      <span>${escape(option)}</span>
    </label>`;
  }).join('')}</div>
  ${options.some(option => option.startsWith('其他（请注明）')) ? `
    <label class="other-field" ${hasOther(question, answer.selected) ? '' : 'hidden'}>
      <span>请注明其他情况</span>
      <input class="input" type="text" data-other="${id}" value="${escape(answer.other)}">
    </label>` : ''}`;
}

function renderQuestion(question) {
  const { id, title: label, hint, multiple, maxChoices, exactChoices, rows } = question;
  const answer = state.answers[id] ?? {};
  const instruction = exactChoices ? '多选 · 请选择三项' : maxChoices ? '多选 · 最多选三项' : multiple ? '多选 · 可选择所有适用项' : rows ? '每行选择一项' : '单选';
  const description = hint ? `${instruction}。 ${hint}` : instruction;
  return `<fieldset class="form-card" id="q${id}" ${visible(question) ? '' : 'hidden'} aria-describedby="hint-${id}">
    <legend class="visually-hidden">Q${id} ${escape(label)}</legend>
    <h2 class="question-label" aria-hidden="true"><span class="qcode">Q${id}</span>${escape(label)}</h2>
    <p class="hint question-hint" id="hint-${id}">${escape(description)}</p>
    ${rows ? matrix(question, answer) : choices(question, answer)}
    <p class="question-error" aria-live="polite" hidden></p>
  </fieldset>`;
}

function render() {
  const { page } = state;
  if (page === sections.length) {
    app.innerHTML = `<section class="completion">
      <h1 tabindex="-1">谢谢参与</h1>
      ${exited ? '<p>问卷已结束，您可以关闭此页面。</p>' : button('谢谢参与', 'exit', true)}
    </section>`;
    return;
  }
  if (showCover) {
    const coverVisual = document.querySelector('#cover-visual').innerHTML;
    const actionLabel = page < 0 ? '开始填写' : '继续填写';
    const resumeNote = page >= 0
      ? `<p class="draft-note">上次填写至第 ${page + 1} 部分 · ${escape(sections[page].title)}</p>`
      : '';
    app.innerHTML = `<div class="welcome">
      <section class="hero">
        <div>
          <p class="cover-kicker">蚕桑科研专家调查</p>
          <h1 tabindex="-1">人工智能在<em>蚕桑产业科研</em>中的应用</h1>
          <p>邀请蚕桑科研人员结合实际经验，评价人工智能的应用现状、面临的挑战与未来前景。</p>
          <div class="hero-buttons">${button(`${actionLabel} <span aria-hidden="true">↗</span>`, 'start', true)}</div>
          ${resumeNote}
          <div class="hero-meta"><span>五部分 · 16 题</span><span>提交前可修改</span><span>支持手机填写</span></div>
        </div>
        ${coverVisual}
      </section>
      <section class="welcome-grid" aria-label="问卷内容">
        <div class="welcome-info"><h3>科研背景与使用现状</h3><p>介绍您的科研方向及在科研工作中使用 AI 的情况。</p></div>
        <div class="welcome-info"><h3>应用效果与现实挑战</h3><p>评价 AI 的应用效果、推广障碍和支持需求。</p></div>
        <div class="welcome-info"><h3>未来发展展望</h3><p>判断未来五年可能取得突破的科研领域。</p></div>
      </section>
      <p class="welcome-note">填写无需登录。答卷保存在当前浏览器，提交前可恢复填写进度。</p>
    </div>`;
    return;
  }
  const section = sections[page];
  app.innerHTML = `<div class="survey-layout">
    <aside class="rail"><p class="rail-title">问卷目录</p><nav aria-label="问卷目录">
      ${sections.map((item, index) => `
        <button type="button" class="step-link ${index === page ? 'active' : index < page ? 'done' : ''}"
          data-action="section" data-page="${index}" ${index === page ? 'aria-current="step"' : index > page ? 'disabled' : ''}>
          <span class="step-number">${index + 1}</span>${escape(item.title)}
        </button>`).join('')}
    </nav></aside>
    <section class="form-main">
      <header class="form-header">
        <div class="section-meta"><span>第 ${page + 1} 部分</span><span>${page + 1} / ${sections.length}</span></div>
        <div class="progress" aria-hidden="true"><span style="width:${(page + 1) / sections.length * 100}%"></span></div>
        <h1 tabindex="-1">${escape(section.title)}</h1>
      </header>
      ${section.intro ? `<p class="notice">${escape(section.intro)}</p>` : ''}
      <p class="notice error" role="alert" hidden>请完成本页标出的题目后继续。</p>
      ${section.questions.map(renderQuestion).join('')}
      <div class="form-actions">
        ${button(page === 0 ? '返回首页' : '上一步', 'back')}
        <div class="action-right"><span class="hint" data-save-status role="status">${saveMessage()}</span>
          ${button(page === sections.length - 1 ? '提交问卷' : '下一步', 'next', true)}</div>
      </div>
    </section>
  </div>`;
}

function updateError(card, message) {
  const error = card.querySelector('.question-error');
  error.textContent = message;
  error.hidden = !message;
  card.classList.toggle('invalid', Boolean(message));
}

function validationMessage(question) {
  const { id, rows, exactChoices, exclusive } = question;
  const { selected, rows: ratings, other } = state.answers[id] ?? {};
  if (rows) {
    return rows.every((_, index) => Number.isInteger(ratings?.[index])) ? '' : '请为每一行选择一个答案。';
  }
  if (selected === undefined || (Array.isArray(selected) && !selected.length)) return '请选择答案。';
  if (exactChoices && selected.length !== exactChoices && !selected.includes(exclusive)) return '请选择三项。';
  if (hasOther(question, selected) && !other?.trim()) return '请注明其他情况。';
  return '';
}

function validateSection() {
  const questions = sections[state.page].questions.filter(visible);
  let firstCard;
  for (const question of questions) {
    const card = document.getElementById(`q${question.id}`);
    const message = validationMessage(question);
    updateError(card, message);
    if (message) firstCard ??= card;
  }
  app.querySelector('.notice.error').hidden = !firstCard;
  firstCard?.querySelector('input')?.focus();
  return !firstCard;
}

function go(page) {
  if (state.page === sections.length) return;
  showCover = page < 0;
  if (!showCover) {
    state.page = page;
    save();
  }
  render();
  window.scrollTo(0, 0);
  app.querySelector('h1').focus({ preventScroll: true });
}

app.addEventListener('click', event => {
  const control = event.target.closest('button[data-action]');
  if (!control) return;
  if (state.page === sections.length) {
    if (control.dataset.action === 'exit') {
      exited = true;
      render();
      app.querySelector('h1').focus({ preventScroll: true });
      window.close();
    }
    return;
  }
  switch (control.dataset.action) {
    case 'start': go(Math.max(0, state.page)); break;
    case 'back': go(state.page - 1); break;
    case 'section': go(Number(control.dataset.page)); break;
    case 'next': if (validateSection()) go(state.page + 1); break;
  }
});

app.addEventListener('change', event => {
  const input = event.target;
  if (!input.matches('[data-q]')) return;
  const id = Number(input.dataset.q);
  const value = Number(input.value);
  const section = sections[state.page];
  const question = section.questions.find(item => item.id === id);
  const card = document.getElementById(`q${id}`);
  const answer = state.answers[id] ??= {};
  if (question.rows) {
    (answer.rows ??= {})[input.dataset.row] = value;
  } else if (question.multiple || question.maxChoices) {
    let selected = answer.selected ?? [];
    if (input.checked && value === question.exclusive) {
      selected = [value];
    } else if (input.checked) {
      selected = selected.filter(option => option !== question.exclusive);
      if (selected.length === question.maxChoices) {
        input.checked = false;
        updateError(card, '最多可选三项。可取消一项后重新选择。');
        return;
      }
      selected.push(value);
    } else {
      selected = selected.filter(option => option !== value);
    }
    answer.selected = selected;
    for (const checkbox of card.querySelectorAll('input[type="checkbox"]')) {
      checkbox.checked = selected.includes(Number(checkbox.value));
    }
  } else {
    answer.selected = value;
  }
  const otherField = card.querySelector('.other-field');
  if (otherField) otherField.hidden = !hasOther(question, answer.selected);
  for (const dependent of section.questions.filter(item => item.hideWhen?.id === id)) {
    const dependentCard = document.getElementById(`q${dependent.id}`);
    dependentCard.hidden = !visible(dependent);
    if (dependentCard.hidden) updateError(dependentCard, '');
  }
  updateError(card, '');
  save();
});

app.addEventListener('input', event => {
  const input = event.target;
  if (!input.matches('[data-other]')) return;
  const id = input.dataset.other;
  state.answers[id].other = input.value;
  updateError(document.getElementById(`q${id}`), '');
  save();
});

render();
</script>
</body>
</html>
